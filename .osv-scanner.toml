# .osv-scanner.toml — osv-scanner v2 configuration for OmniRoute
#
# Purpose: record ACCEPTED-RISK vulnerability suppressions so the
# vuln-count ratchet (scripts/check/check-vuln-ratchet.mjs --ratchet)
# does not fail on findings the team has reviewed and decided not to
# remediate immediately.
#
# RULE (mirrors other allowlists in this repo): every [[skip]] entry
# requires a justification and is subject to re-review at each release
# cycle. Suppressions are for accepted-risk findings ONLY — they are
# not a substitute for fixing a vulnerable dependency when a fix exists.
#
# Baseline (config/quality/quality-baseline.json):
#   metrics.vulnCount.value = 7   (direction: down)
# Measured on this tree (osv-scanner v2.3.8, package-lock.json): 12
#   12 > 7 = REGRESSION → gate fails (exit 1).
# Driver: 7 NEW CVEs disclosed Nov 2026 on next@16.4.2 (production dep).
#   All are fixed in next 16.4.5 → preferred fix is `bump next`,
#   which returns the count to 5 (<= baseline 7, gate green).
# Remaining 5 are dev-only (glob, minimatch, disclosed 2026-10-30);
#   bump glob→14.0.2 and minimatch→11.0.1, or accept below as dev-only.
#
# To apply: remove the [[skip]] entries below once the corresponding
# dependency is bumped, then re-run:
#   osv-scanner --format json --lockfile package-lock.json
#   node scripts/check/check-vuln-ratchet.mjs --ratchet

[[skip]]
  package = { name = "glob", ecosystem = "npm", version = "10.5.0" }
  vuln = "GHSA-3g3m-2fjr-6pw4"
  justification = "dev-only transitive dep (glob is a dev tooling dep). AbortSignal traversal bypass (CWE-400, MODERATE). Bump glob to >= 14.0.2 to remediate; accepted until the dev-dep upgrade cycle lands."

[[skip]]
  package = { name = "glob", ecosystem = "npm", version = "13.0.6" }
  vuln = "GHSA-3g3m-2fjr-6pw4"
  justification = "dev-only transitive dep. Same GHSA-3g3m-2fjr-6pw4 as above; fix is glob >= 14.0.2."

[[skip]]
  package = { name = "minimatch", ecosystem = "npm", version = "9.0.9" }
  vuln = "GHSA-g3hv-75wg-m249"
  justification = "dev-only transitive dep. Regex/globparts amplification DoS (CWE-405, MODERATE). Bump minimatch to >= 11.0.1 to remediate; accepted until the dev-dep upgrade cycle lands."

[[skip]]
  package = { name = "minimatch", ecosystem = "npm", version = "10.2.5" }
  vuln = "GHSA-g3hv-75wg-m249"
  justification = "dev-only transitive dep. Same GHSA-g3hv-75wg-m249 as above; fix is minimatch >= 11.0.1."

[[skip]]
  package = { name = "minimatch", ecosystem = "npm", version = "10.2.6" }
  vuln = "GHSA-g3hv-75wg-m249"
  justification = "dev-only transitive dep. Same GHSA-g3hv-75wg-m249 as above; fix is minimatch >= 11.0.1."

