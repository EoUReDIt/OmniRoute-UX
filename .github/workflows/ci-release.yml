name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v3.8.56)"
        required: true
        type: string
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: "27"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # 1. Pre-release checks
  pre-release:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Check Node.js version (minimum 21)
        run: |
          NODE_VERSION=$(node --version | sed \'s/v//\')
          MAJOR_VERSION=$(echo $NODE_VERSION | cut -d. -f1)
          if [ "$MAJOR_VERSION" -lt 21 ]; then
            echo "::error::Node.js version $NODE_VERSION is below minimum required version 21"
            exit 1
          fi
          echo "Node.js version $NODE_VERSION meets minimum requirement (>= 21)"
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Run all tests
        run: |
          npm run test:unit
          npm run lint
          npm run typecheck
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # Strip 'v' prefix for npm
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [[ -n "$PREV_TAG" ]]; then
            git log --oneline --pretty=format:"- %s (%h)" $PREV_TAG..HEAD > CHANGELOG.md
          else
            git log --oneline --pretty=format:"- %s (%h)" -20 > CHANGELOG.md
          fi
          
          # Format for release
          cat > RELEASE_NOTES.md << EOF
          # Release ${{ steps.version.outputs.version }}
          
          $(cat CHANGELOG.md)
          
          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}
          EOF
          
          cat RELEASE_NOTES.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 2. Build & Package
  build:
    name: Build & Package
    needs: pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - name: Check Node.js version (minimum 21)
        run: |
          NODE_VERSION=$(node --version | sed 's/v//')
          MAJOR_VERSION=$(echo $NODE_VERSION | cut -d. -f1)
          if [ "$MAJOR_VERSION" -lt 21 ]; then
            echo "::error::Node.js version $NODE_VERSION is below minimum required version 21"
            exit 1
          fi
          echo "Node.js version $NODE_VERSION meets minimum requirement (>= 21)"
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Build
        run: npm run build
      
      - name: Package
        run: |
          npm pack --dry-run 2>&1 | head -50
          PACKAGE_SIZE=$(npm pack --dry-run 2>&1 | grep -oP '(?<=size: ).*' | head -1)
          echo "Package size: $PACKAGE_SIZE"
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ needs.pre-release.outputs.version }}
          path: "*.tgz"
          retention-days: 7

  # 3. Docker Build & Push
  docker:
    name: Docker Build & Push
    needs: [pre-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.pre-release.outputs.version }}
            type=raw,value=latest,enable={{ github.repository == github.event.repository.name && github.ref == 'refs/heads/main' }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. GitHub Release
  github-release:
    name: GitHub Release
    needs: [pre-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.pre-release.outputs.version }}
          name: Release v${{ needs.pre-release.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. NPM Publish (if configured)
  npm-publish:
    name: NPM Publish
    needs: [pre-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.dry_run != 'true' && secrets.NPM_TOKEN != '' }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ needs.pre-release.outputs.version }}
      
      - name: Publish to NPM
        run: npm publish *.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
